name: 02 - Manual
on:
  workflow_dispatch:
    inputs:
      logging_level:
        description: "Nivel de log"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug
          - warn
          - error
      environment:
        required: true
        type: environment
      dry_run:
        type: boolean
        required: true
        default: false
      reason:
        type: string
        default: "Manual execution"

jobs:
  manual:
    runs-on: ubuntu-24.04
    env:
      LOG_LEVEL: ${{ inputs.logging_level }}
      ENVIRONMENT: ${{ inputs.environment }}
      DRY_RUN: ${{ inputs.dry_run }}
      REASON: ${{ inputs.reason }}
    steps: 
      - name: Print vars
        run: |
          echo "$LOG_LEVEL"
          echo "$ENVIRONMENT"
          echo "$DRY_RUN"
          echo "$REASON"

      # comparamos con 'false'/'true' porque los inputs llegan como string:
      # es mas explicito y seguro que negar con ! (antes: if: ${{ !inputs.dry_run }})
      - name: Deploy
      # solo corre si NO es dry run
      # usamos la env var $ENVIRONMENT definida arriba, en vez de interpolar el input en el run
        if: inputs.dry_run == 'false' 
        run: echo "Deploying to $ENVIRONMENT"
      - name: Dry run
      # solo corre si ES dry run
        if: inputs.dry_run == 'true'
        run: echo "Dry run enabled"
