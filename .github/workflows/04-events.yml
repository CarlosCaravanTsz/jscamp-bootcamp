name: 04 - Events
on:
  workflow_dispatch:
    
  issue_comment:
    types:
      - created
  
  issues:
    types:
      - opened
      - reopened
      - assigned

  pull_request_review_comment:
    
jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues:
        write
    steps:
      # los valores del evento se pasan por env vars en vez de interpolarlos en el run:
      # si un body de comentario trae saltos de linea o comillas, interpolarlo directo rompe el script
      - name: Imprimir
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "$EVENT_NAME"
          echo "$ISSUE_NUMBER"
          echo "$COMMENT_BODY"
      - name: Publicar comentario
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run:  gh issue comment ${{ github.event.issue.number }} --body "Hola! gracias por tu aporte"
        
      