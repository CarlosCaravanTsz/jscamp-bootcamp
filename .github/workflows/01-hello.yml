name: 01 - Hello
  
on:
  workflow_dispatch:
    

jobs:
  saludar:
    runs-on: ubuntu-24.04
    steps:
      - name: Saludar
        run: echo "Hola desde GitHub Actions!"

      - name: Ver fecha del runner
        run: date

      - name: Ver archivos disponibles
        run: ls -la
  repo-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Listar archivos del repo
        run: ls -la
